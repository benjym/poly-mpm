[project]
name = "poly-mpm"
version = "1.0.1"
description = "A Python implementation of the Polydisperse Material Point Method"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.14"
keywords = ["mpm", "polydisperse", "material point method", "poly-mpm", "granular material", "granular media"]
authors = [
    {name = "Benjy Marks", email = "benjy.marks@sydney.edu.au"}
]
maintainers = [
    {name = "Benjy Marks", email = "benjy.marks@sydney.edu.au"}
]

dependencies = [
    "numpy>=2.5.4",
    "scipy>=1.18.1",
    "astropy>=8.0.2",
    "matplotlib>=3.11.2",
    "rich>=15",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 110
target-version = ['py314']
required-version = '26.10.1'

[project.optional-dependencies]
gpu = ["slangpy>=0.43.1; sys_platform == 'darwin' and platform_machine == 'arm64'"]
dev = ["pytest>=9.2", "pytest-cov>=7.1", "black==26.10.1"]
release = ["build>=1.3", "twine>=6.2"]
docs = ["sphinx>=8.2", "myst-parser>=4"]

[project.scripts]
poly-mpm = "MPM:main"

[tool.setuptools]
py-modules = ["MPM", "initialise", "grid", "particles", "constit", "transfers", "integrators", "plotting", "interpolation", "kinematics", "diagnostics", "stability", "quadrature", "granular", "granular_mixed", "cidr", "settings", "checkpoint"]

[tool.setuptools.packages.find]
include = ["inputs", "mpm_gpu", "mpm_gpu.*"]

[tool.setuptools.package-data]
"mpm_gpu.shaders" = ["*.slang"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[project.urls]
Repository = "https://github.com/benjym/poly-mpm"
Issues = "https://github.com/benjym/poly-mpm/issues"

[tool.coverage.run]
branch = true
relative_files = true
source = ["MPM", "initialise", "grid", "particles", "constit", "transfers", "integrators", "plotting", "interpolation", "kinematics", "diagnostics", "stability", "quadrature", "granular", "granular_mixed", "cidr", "settings", "inputs"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.coverage.xml]
output = "coverage.xml"
