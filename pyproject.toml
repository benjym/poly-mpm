[project]
name = "poly-mpm"
version = "1.0.0"
description = "A Python implementation of the Polydisperse Material Point Method"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.14"
keywords = ["mpm", "polydisperse", "material point method", "poly-mpm", "granular material", "granular media"]
authors = [
    {name = "Benjy Marks", email = "benjy.marks@sydney.edu.au"}
]
maintainers = [
    {name = "Benjy Marks", email = "benjy.marks@sydney.edu.au"}
]

dependencies = [
    "numpy>=2.5.4",
    "scipy>=1.18.1",
    "astropy>=8.0.2",
    "matplotlib>=3.11.2",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 110
target-version = ['py314']

[project.optional-dependencies]
dev = ["pytest>=9.2"]

[project.scripts]
poly-mpm = "MPM:main"

[tool.setuptools]
py-modules = ["MPM", "initialise", "grid", "particles", "constit", "transfers", "integrators", "plotting"]

[tool.setuptools.packages.find]
include = ["inputs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
