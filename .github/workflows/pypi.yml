name: Publish to PyPI

on:
  push:
    tags:
      - 'v[0-9]*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (must match pyproject.toml)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pypi-publish
  cancel-in-progress: false

env:
  MPLCONFIGDIR: /tmp/poly-mpm-matplotlib
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'

jobs:
  build:
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - run: python -m pip install uv==0.13.6
      - run: uv sync --locked --extra dev --extra release
      - name: Check tag or requested release version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os, tomllib
          from pathlib import Path
          version = tomllib.loads(Path('pyproject.toml').read_text())['project']['version']
          if os.environ['RELEASE_EVENT'] == 'push':
              expected = f'v{version}'
              if os.environ['RELEASE_TAG'] != expected:
                  raise SystemExit(f'Release tag must match pyproject.toml: {expected}')
          elif os.environ['RELEASE_VERSION'] != version:
              raise SystemExit(f'Requested version must match pyproject.toml: {version}')
          PY
      - run: uv run --locked black --check .
      - run: uv run --locked python -m pytest -q -W error::RuntimeWarning
      - run: uv build --no-sources
      - run: uv run --locked python -m twine check --strict dist/*
      - name: Test distributions outside the checkout
        run: |
          uv venv "$RUNNER_TEMP/wheel-check"
          uv pip install --python "$RUNNER_TEMP/wheel-check/bin/python" dist/*.whl
          uv venv "$RUNNER_TEMP/sdist-check"
          uv pip install --python "$RUNNER_TEMP/sdist-check/bin/python" dist/*.tar.gz
          cd "$RUNNER_TEMP"
          for kind in wheel sdist; do
            "$RUNNER_TEMP/$kind-check/bin/python" -I - <<'PY'
          from initialise import get_parameters
          from MPM import run
          P, G, L = get_parameters(['modern_ball'])
          run(P, G, L, max_steps=3, output=False)
          assert P.tstep == 3
          PY
          done
      - uses: actions/upload-artifact@v7
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    # No environment: matches the pending publisher configured on pypi.org.
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-distributions
          path: dist/
      - name: Publish distributions using Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
