name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MPLCONFIGDIR: /tmp/poly-mpm-matplotlib
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"

jobs:
  formatting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - run: python -m pip install uv==0.13.6
      - run: uv sync --locked --extra dev
      - run: uv run --locked black --check .

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - run: python -m pip install uv==0.13.6
      - run: uv sync --locked --extra dev
      - name: Tests with branch coverage
        run: uv run --locked python -m pytest -q -W error::RuntimeWarning --cov --cov-report=term-missing --cov-report=xml
      - name: Upload coverage reports to Codecov
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          disable_search: true
          fail_ci_if_error: true

  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - run: python -m pip install uv==0.13.6
      - run: uv sync --locked --extra docs
      - run: uv run --locked python -m sphinx -b html -W --keep-going docs build/manual

  distributions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - run: python -m pip install uv==0.13.6
      - run: uv sync --locked --extra release
      - run: uv build --no-sources
      - run: uv run --locked python -m twine check --strict dist/*
      - name: Smoke test installed wheel outside checkout
        run: |
          uv venv "$RUNNER_TEMP/poly-mpm-wheel"
          uv pip install --python "$RUNNER_TEMP/poly-mpm-wheel/bin/python" dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/poly-mpm-wheel/bin/python" -I - <<'PY'
          from initialise import get_parameters
          from MPM import run
          P, G, L = get_parameters(['modern_ball'])
          run(P, G, L, max_steps=3, output=False)
          assert P.tstep == 3
          assert L.materials[0].F.shape[1:] == (3, 3)
          PY
